name: build

# Pull requests and pushes to main build and test on Linux only, to save Actions
# minutes (private repos bill Windows at 2x and macOS at 10x). A v* tag builds
# all three OSes and publishes a GitHub Release. Run manually for a full build
# without releasing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Test with report
        run: make report

      - name: Publish test summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report produced; see the 'Test with report' step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/
          if-no-files-found: warn

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$(git describe --tags --always)" \
            -o dist/pgp-tools-linux-amd64 ./cmd/pgp-tools

      - uses: actions/upload-artifact@v4
        with:
          name: pgp-tools-linux-amd64
          path: dist/*

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test and build
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          $info = (Get-Item dist/pgp-tools.exe).VersionInfo
          if ($info.ProductName -ne 'PGP Tools') { throw "exe is missing its version resource (windres not run?)" }
          Move-Item dist/pgp-tools.exe dist/pgp-tools-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pgp-tools-windows-amd64
          path: dist/*

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./internal/... ./tools/...

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$(git describe --tags --always)" \
            -o dist/pgp-tools-macos-arm64 ./cmd/pgp-tools

      - uses: actions/upload-artifact@v4
        with:
          name: pgp-tools-macos-arm64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pgp-tools-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum pgp-tools-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PGP Tools $TAG" \
            --generate-notes \
            $prerelease

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pgp-tools-linux-amd64
            ext: ""
            ldextra: ""
          - os: windows-latest
            artifact: pgp-tools-windows-amd64
            ext: ".exe"
            ldextra: "-H windowsgui"
          - os: macos-latest
            artifact: pgp-tools-macos-arm64
            ext: ""
            ldextra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Test with report
        if: runner.os == 'Linux'
        run: make report

      - name: Publish test summary
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report produced; see the 'Test with report' step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/
          if-no-files-found: warn

      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./internal/... ./tools/...

      - name: Build
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} ${{ matrix.ldextra }}" \
            -o "dist/${{ matrix.artifact }}${{ matrix.ext }}" ./cmd/pgp-tools

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
